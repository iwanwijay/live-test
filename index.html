<!doctype html>
<html lang="id">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>WebRTC SFU Live Streaming</title>
  </head>
  <body>
    <div style="display: flex; gap: 20px; padding: 20px">
      <!-- SISI STREAMER / PUBLISHER -->
      <div style="flex: 1">
        <h2>Streamer (Publish)</h2>
        <input
          type="text"
          id="publishIdInput"
          value="room-1"
          placeholder="Stream ID"
        />
        <!-- ID harus startPublishBtn -->
        <button id="startPublishBtn">Start Live</button>
        <br /><br />
        <!-- Pastikan video menggunakan id localVideo, autoplay, muted, playsinline -->
        <video
          id="localVideo"
          autoplay
          muted
          playsinline
          style="width: 100%; background: #000"
        ></video>
      </div>

      <!-- SISI PENONTON / SUBSCRIBER -->
      <div style="flex: 1">
        <h2>Penonton (Subscribe)</h2>
        <input
          type="text"
          id="subscribeIdInput"
          value="room-1"
          placeholder="Stream ID"
        />
        <!-- ID harus startSubscribeBtn -->
        <button id="startSubscribeBtn">Watch Live</button>
        <br /><br />
        <!-- Pastikan video menggunakan id remoteVideo, autoplay, playsinline, controls -->
        <video
          id="remoteVideo"
          autoplay
          playsinline
          muted
          controls
          style="width: 100%; background: #000"
        ></video>
      </div>
    </div>

    <!-- BIND SCRIPT TYPESCRIPT / VITE -->
    <script type="module" src="/src/app.ts"></script>
  </body>
</html>
